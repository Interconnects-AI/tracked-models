name: Model metadata correction
description: Report an incorrect release date, total parameter count, or active parameter count.
title: "[Model metadata]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the public metadata used by Artifacts Hub. Please cite an official model card, paper, or launch announcement rather than inferred Hugging Face API metadata.

  - type: dropdown
    id: correction_type
    attributes:
      label: Metadata field
      description: Which value needs correction?
      options:
        - Release date
        - Total parameter count
        - Active parameter count
    validations:
      required: true

  - type: input
    id: model_id
    attributes:
      label: Exact checkpoint ID
      description: Preserve the checkpoint's case-sensitive Hugging Face org/model identifier.
      placeholder: org/model-name
    validations:
      required: true

  - type: input
    id: checkpoint_or_hub_url
    attributes:
      label: Checkpoint or Artifacts Hub URL
      placeholder: https://huggingface.co/org/model-name
    validations:
      required: true

  - type: textarea
    id: current_value
    attributes:
      label: Current value
      description: Include the value currently shown and its unit or date format.
    validations:
      required: true

  - type: textarea
    id: proposed_value
    attributes:
      label: Proposed value
      description: Parameter counts should be given in decimal billions; dates should use YYYY-MM-DD.
    validations:
      required: true

  - type: input
    id: authoritative_source
    attributes:
      label: Authoritative source
      description: Link directly to an official model card, paper, or launch announcement that states the proposed value.
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: Explanation
      description: Explain how the source supports the correction, including total versus active parameters or repository creation versus public launch date.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Source confirmation
      options:
        - label: I confirmed that the source explicitly supports the proposed value rather than relying on a model name or raw Hugging Face API metadata.
          required: true
