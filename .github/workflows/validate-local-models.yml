name: Validate local model catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-models.csv"
      - "models.csv"
      - "extra_models.csv"
      - "metadata/organization_regions.csv"
      - "metadata/local_models*"
      - "scripts/*.py"
      - "tests/*.py"
      - ".github/workflows/validate-local-models.yml"
  push:
    branches: [main]
    paths:
      - "local-models.csv"
      - "models.csv"
      - "extra_models.csv"
      - "metadata/organization_regions.csv"
      - "metadata/local_models*"
      - "scripts/*.py"
      - "tests/*.py"
      - ".github/workflows/validate-local-models.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "duckdb>=1.3,<2" "ijson>=3.3,<4" "pytest>=8,<10"
      - name: Validate catalog, parent joins, evidence, and artifact hashes
        run: >-
          python scripts/local_models.py --validate
          --candidates metadata/local_models_candidates.csv
          --source-manifest metadata/local_models_sources.json
      - name: Test discovery and collection rules offline
        run: python -m pytest tests -q
      - name: Replay popularity coverage audits offline
        run: |
          python scripts/audit_local_model_popularity.py --check --metric downloads --top 2000 \
            --metadata metadata/local_models_popularity_recent_input.jsonl.gz \
            --source-manifest metadata/local_models_popularity_recent_input.jsonl.gz.manifest.json \
            --candidates metadata/local_models_candidates.csv \
            --output metadata/local_models_popularity_recent.jsonl \
            --report metadata/local_models_popularity_recent_report.json
          python scripts/audit_local_model_popularity.py --check --metric downloadsAllTime --top 2000 \
            --metadata metadata/local_models_popularity_lifetime_input.jsonl.gz \
            --source-manifest metadata/local_models_popularity_lifetime_input.jsonl.gz.manifest.json \
            --candidates metadata/local_models_candidates.csv \
            --output metadata/local_models_popularity_lifetime.jsonl \
            --report metadata/local_models_popularity_lifetime_report.json
