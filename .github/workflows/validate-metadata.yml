name: Validate curated metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "models.csv"
      - "extra_models.csv"
      - "metadata/organization_regions.csv"
      - "metadata/validate_organization_regions.py"
      - "metadata/test_validate_organization_regions.py"
      - "metadata/model_parameters.csv"
      - "metadata/model_sizes.py"
      - "metadata/generate_model_sizes.py"
      - "metadata/test_generate_model_sizes.py"
      - ".github/workflows/validate-metadata.yml"
  push:
    branches:
      - main
    paths:
      - "models.csv"
      - "extra_models.csv"
      - "metadata/organization_regions.csv"
      - "metadata/validate_organization_regions.py"
      - "metadata/test_validate_organization_regions.py"
      - "metadata/model_parameters.csv"
      - "metadata/model_sizes.py"
      - "metadata/generate_model_sizes.py"
      - "metadata/test_generate_model_sizes.py"
      - ".github/workflows/validate-metadata.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate parameter metadata and generated map
        run: python metadata/generate_model_sizes.py --check

      - name: Test metadata validation rules
        run: python -m unittest metadata/test_generate_model_sizes.py

      - name: Validate organization-region metadata
        run: python metadata/validate_organization_regions.py

      - name: Test organization-region validation rules
        run: python -m unittest metadata/test_validate_organization_regions.py
