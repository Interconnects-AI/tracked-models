name: Validate curated metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "models.csv"
      - "extra_models.csv"
      - "metadata/organization_regions.csv"
      - "metadata/validate_organization_regions.py"
      - "metadata/test_validate_organization_regions.py"
      - "metadata/model_parameters.csv"
      - "metadata/model_sizes.py"
      - "metadata/generate_model_sizes.py"
      - "metadata/test_generate_model_sizes.py"
      - "metadata/audit_parameter_coverage.py"
      - "metadata/test_audit_parameter_coverage.py"
      - "metadata/release_date_corrections.csv"
      - "metadata/validate_release_date_corrections.py"
      - "metadata/test_validate_release_date_corrections.py"
      - "local-models.csv"
      - "metadata/local_models.py"
      - "metadata/local_models_overrides.json"
      - "metadata/test_local_models.py"
      - ".github/workflows/validate-metadata.yml"
  push:
    branches:
      - main
    paths:
      - "models.csv"
      - "extra_models.csv"
      - "metadata/organization_regions.csv"
      - "metadata/validate_organization_regions.py"
      - "metadata/test_validate_organization_regions.py"
      - "metadata/model_parameters.csv"
      - "metadata/model_sizes.py"
      - "metadata/generate_model_sizes.py"
      - "metadata/test_generate_model_sizes.py"
      - "metadata/audit_parameter_coverage.py"
      - "metadata/test_audit_parameter_coverage.py"
      - "metadata/release_date_corrections.csv"
      - "metadata/validate_release_date_corrections.py"
      - "metadata/test_validate_release_date_corrections.py"
      - "local-models.csv"
      - "metadata/local_models.py"
      - "metadata/local_models_overrides.json"
      - "metadata/test_local_models.py"
      - ".github/workflows/validate-metadata.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate parameter metadata and generated map
        run: python metadata/generate_model_sizes.py --check

      - name: Test metadata validation rules
        run: python -m unittest metadata/test_generate_model_sizes.py metadata/test_audit_parameter_coverage.py

      - name: Check primary model size coverage
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [[ -n "$BASE_REF" && ! "$BASE_REF" =~ ^0+$ ]]; then
            args=(--base-ref "$BASE_REF" --check)
          fi
          python -m metadata.audit_parameter_coverage "${args[@]}" \
            --json-output "$RUNNER_TEMP/parameter-coverage.json" --markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload parameter coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameter-coverage
          path: ${{ runner.temp }}/parameter-coverage.json
          if-no-files-found: ignore

      - name: Validate organization-region metadata
        run: python metadata/validate_organization_regions.py

      - name: Test organization-region validation rules
        run: python -m unittest metadata/test_validate_organization_regions.py

      - name: Validate release-date corrections
        run: python metadata/validate_release_date_corrections.py

      - name: Test release-date correction validation rules
        run: python -m unittest metadata/test_validate_release_date_corrections.py

      - name: Validate local model conversions
        run: python metadata/local_models.py --validate

      - name: Test local model conversion rules
        run: python -m unittest metadata/test_local_models.py
