name: Sync Hugging Face tracked models

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:17 UTC. Avoid top-of-hour GitHub Actions load.
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-hf-models
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run sync_hf_models.py \
            --write \
            --policy policy/model_policy.yml \
            --report "$RUNNER_TEMP/model_sync.md" \
            --since-days 14 \
            --update-readme \
            --mention "@xeophon" \
            --verbose

      - name: Detect changes
        id: changes
        run: |
          if git status --short -- models.csv extra_models.csv README.md | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/sync-hf-models
          delete-branch: true
          commit-message: Update tracked Hugging Face models
          title: Update tracked Hugging Face models
          body-path: ${{ runner.temp }}/model_sync.md
          add-paths: |
            models.csv
            extra_models.csv
            README.md
