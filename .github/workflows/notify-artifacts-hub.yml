name: Notify Artifacts Hub of metadata updates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "metadata/model_parameters.csv"
      - "metadata/release_date_corrections.csv"

permissions:
  contents: read

concurrency:
  group: notify-artifacts-hub-metadata
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch metadata update
        env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HUB_DISPATCH_TOKEN is not configured"
            exit 1
          fi
          gh api \
            --method POST \
            repos/projectvail/artifacts-hub/dispatches \
            -f event_type=tracked-models-metadata-updated \
            -f "client_payload[tracked_models_sha]=$GITHUB_SHA"
